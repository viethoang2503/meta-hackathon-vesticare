<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice test</title>
  <style>
    :root { color-scheme: dark; --bg: #11151c; --panel: #1b212b; --text: #e8ecf1; --muted: #9aa5b4; --ok: #3ecf8e; --help: #ff6b6b; --unclear: #f5b14c; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.45 -apple-system, system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    section { background: var(--panel); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    button, select { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid #344052; background: #232b37; color: var(--text); width: 100%; margin-top: 8px; }
    button:disabled { opacity: 0.5; }
    .muted { color: var(--muted); font-size: 14px; }
    .verdict-ok { color: var(--ok); } .verdict-help { color: var(--help); } .verdict-unclear { color: var(--unclear); }
    #now { font-size: 22px; min-height: 1.5em; }
    li { margin-bottom: 6px; }
  </style>
</head>
<body>
  <h1>Thử giọng nói "Are you OK?"</h1>

  <section>
    <div id="caps" class="muted"></div>
    <select id="lang" aria-label="Ngôn ngữ">
      <option value="en-US">English: hỏi "Are you OK?", trả lời "I'm OK" hoặc "Help"</option>
      <option value="vi-VN">Tiếng Việt: hỏi "Bạn có ổn không?", trả lời "Tôi ổn" hoặc "Cứu"</option>
    </select>
  </section>

  <section>
    <button id="ask" type="button">1. Hỏi rồi nghe (bấm tay)</button>
    <button id="listen" type="button">2. Chỉ nghe (bấm tay)</button>
    <button id="timer" type="button">3. Tự hỏi sau 5 s, không bấm (giống lúc ngã)</button>
    <p class="muted">Thử theo thứ tự 1, 2, 3. Lần đầu Safari sẽ xin quyền micro và nhận dạng giọng nói.</p>
  </section>

  <section>
    <div id="now" aria-live="polite"></div>
    <div id="heard" class="muted"></div>
  </section>

  <section>
    <strong>Kết quả các lần thử</strong>
    <ol id="log" class="muted"></ol>
  </section>

  <script type="module" src="voice-test.js"></script>
</body>
</html>
