# Experiment: 1D-CNN 3-class (float32 + INT8)
# Inherits base.yaml — only overrides are listed here.

experiment:
  name: "cnn_3class"
  model: "cnn"
  description: "1D-CNN float32 and INT8 TFLite for 3-class vestibular/fall detection"
  paper_table: "B.3"

# ── Model architecture ───────────────────────────────────────
model:
  type: "cnn"
  layers:
    - {type: Conv1D, filters: 16, kernel_size: 5, activation: relu, padding: same}
    - {type: BatchNormalization}
    - {type: MaxPooling1D, pool_size: 2}
    - {type: Dropout, rate: 0.2}
    - {type: Conv1D, filters: 32, kernel_size: 3, activation: relu, padding: same}
    - {type: BatchNormalization}
    - {type: MaxPooling1D, pool_size: 2}
    - {type: Dropout, rate: 0.2}
    - {type: Conv1D, filters: 32, kernel_size: 3, activation: relu, padding: same}
    - {type: BatchNormalization}
    - {type: GlobalAveragePooling1D}
    - {type: Dense, units: 32, activation: relu}
    - {type: Dropout, rate: 0.4}
    - {type: Dense, units: 3, activation: softmax}

# ── Training ─────────────────────────────────────────────────
training:
  optimizer: adam
  learning_rate: 0.001
  loss: categorical_crossentropy
  epochs: 50
  batch_size: 64
  validation_split: 0.15
  class_weight: balanced
  early_stopping:
    monitor: val_loss
    patience: 10
    restore_best_weights: true
  reduce_lr:
    monitor: val_loss
    factor: 0.5
    patience: 4
    min_lr: 0.000001
  augmentation:
    enabled: true
    techniques: [jitter, scale, time_shift]
    jitter_std: 0.05
    scale_range: [0.85, 1.15]
    shift_range: [-3, 3]
  repeated_seeds: 1     # set to 3 for paper-quality results
  seeds: [42]

# ── Quantization ────────────────────────────────────────────
quantization:
  export_float32_tflite: true
  export_int8_tflite: true
  calibration_samples_per_class: 200   # balanced 3-class calibration dataset
  int8_input: true
  int8_output: true

# ── Output ──────────────────────────────────────────────────
output:
  save_keras: true
  save_tflite_f32: true
  save_tflite_int8: true
  save_training_history: true
  model_dir: "ml/models_3class"
