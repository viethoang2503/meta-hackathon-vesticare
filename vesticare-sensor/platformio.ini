; vesticare-sensor/platformio.ini
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1

[env:native]
platform = native
build_flags = -std=c++17 -Iinclude -DUNITY_INCLUDE_DOUBLE
build_src_filter = +<imu_math.cpp> +<payload.cpp> +<transport_mode.cpp>
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
test_framework = unity
